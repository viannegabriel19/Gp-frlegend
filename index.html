<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi GP - Chronos & Places</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --success: #22c55e;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            position: relative;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--accent);
        }

        .lock-container {
            position: relative;
        }

        .lock-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .lock-btn.unlocked {
            border-color: var(--success);
            color: var(--success);
        }

        .auth-box {
            display: none;
            position: absolute;
            right: 0;
            top: 50px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
            width: 220px;
        }

        .auth-box.active {
            display: block;
        }

        .auth-box input {
            margin-bottom: 8px;
        }

        .auth-box button {
            width: 100%;
            background: var(--accent);
            border: none;
            padding: 6px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            color: #0f172a;
        }

        .main-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .main-tab {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .main-tab.active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }

        .rounds-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .round-btn {
            min-width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .round-btn.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }

        .panel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel.active {
            display: block;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .driver-row {
            display: grid;
            grid-template-columns: 120px 1fr 100px;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .driver-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        input, select {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        input:disabled, select:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .results-table th, .results-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.9rem;
        }

        .results-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .badge-1 { background: var(--gold); color: #0f172a; }
        .badge-2 { background: var(--silver); color: #0f172a; }
        .badge-3 { background: var(--bronze); color: #fff; }

        @media(max-width: 600px) {
            .driver-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏆 Gestion GP</h1>
        <div class="lock-container">
            <button class="lock-btn" id="lockBtn" onclick="toggleLockClick()">🔒 Verrouillé</button>
            <div class="auth-box" id="authBox">
                <input type="password" id="pwdInput" placeholder="Mot de passe" onkeydown="checkEnter(event)">
                <button onclick="submitPassword()">Valider</button>
            </div>
        </div>
    </header>

    <div class="main-tabs">
        <button class="main-tab active" onclick="switchMainTab('qualif')">⏱️ Chronos Qualifs</button>
        <button class="main-tab" onclick="switchMainTab('places')">🏁 Places Finales</button>
    </div>

    <!-- ONGLET 1 : CHRONOS QUALIFS -->
    <div id="tab-qualif" class="panel active">
        <div class="rounds-nav" id="qualifRoundsNav"></div>
        <div id="qualifContent"></div>
    </div>

    <!-- ONGLET 2 : PLACES FINALES -->
    <div id="tab-places" class="panel">
        <div class="rounds-nav" id="placesRoundsNav"></div>
        <div id="placesContent"></div>
    </div>
</div>

<script>
    const drivers = ["Nathan", "Gabriel", "Guillaume", "Paul", "Baptiste", "Raphaël"];
    let currentMainTab = 'qualif';
    let currentRound = 1;
    let isUnlocked = false;

    let qualifData = JSON.parse(localStorage.getItem('gp_qualif_data')) || {};
    let placesData = JSON.parse(localStorage.getItem('gp_places_data')) || {};

    function init() {
        renderRoundsNav();
        renderQualifPanel();
        renderPlacesPanel();
    }

    function toggleLockClick() {
        if (!isUnlocked) {
            let box = document.getElementById('authBox');
            box.classList.toggle('active');
            if (box.classList.contains('active')) {
                document.getElementById('pwdInput').focus();
            }
        } else {
            isUnlocked = false;
            document.getElementById('lockBtn').innerHTML = "🔒 Verrouillé";
            document.getElementById('lockBtn').classList.remove('unlocked');
            refreshInputsState();
        }
    }

    function checkEnter(e) {
        if (e.key === 'Enter') {
            submitPassword();
        }
    }

    function submitPassword() {
        let pwd = document.getElementById('pwdInput').value;
        if (pwd === "gab173") {
            isUnlocked = true;
            document.getElementById('lockBtn').innerHTML = "🔓 Déverrouillé";
            document.getElementById('lockBtn').classList.add('unlocked');
            document.getElementById('authBox').classList.remove('active');
            document.getElementById('pwdInput').value = '';
            refreshInputsState();
        } else {
            alert("Mot de passe incorrect.");
        }
    }

    function refreshInputsState() {
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(el => {
            if (el.id !== 'pwdInput') el.disabled = !isUnlocked;
        });
    }

    function switchMainTab(tab) {
        currentMainTab = tab;
        document.querySelectorAll('.main-tab').forEach(el => el.classList.remove('active'));
        if (tab === 'qualif') {
            document.querySelectorAll('.main-tab')[0].classList.add('active');
            document.getElementById('tab-qualif').classList.add('active');
            document.getElementById('tab-places').classList.remove('active');
        } else {
            document.querySelectorAll('.main-tab')[1].classList.add('active');
            document.getElementById('tab-qualif').classList.remove('active');
            document.getElementById('tab-places').classList.add('active');
        }
        renderRoundsNav();
    }

    function switchRound(round) {
        currentRound = round;
        renderRoundsNav();
        renderQualifPanel();
        renderPlacesPanel();
    }

    function renderRoundsNav() {
        const navId = currentMainTab === 'qualif' ? 'qualifRoundsNav' : 'placesRoundsNav';
        let html = '';
        for (let i = 1; i <= 10; i++) {
            html += `<button class="round-btn ${i === currentRound ? 'active' : ''}" onclick="switchRound(${i})">${i}</button>`;
        }
        document.getElementById(navId).innerHTML = html;
    }

    function parseTimeToSeconds(timeStr) {
        if (!timeStr) return Infinity;
        timeStr = timeStr.trim().replace(',', '.');
        if (timeStr.includes(':')) {
            const parts = timeStr.split(':');
            const mins = parseFloat(parts[0]) || 0;
            const secs = parseFloat(parts[1]) || 0;
            return mins * 60 + secs;
        }
        return parseFloat(timeStr) || Infinity;
    }

    function formatSeconds(sec) {
        if (sec === Infinity || isNaN(sec)) return "--:--.---";
        let mins = Math.floor(sec / 60);
        let remainder = (sec % 60).toFixed(3);
        if (remainder < 10) remainder = "0" + remainder;
        return mins > 0 ? `${mins}:${remainder}` : `${remainder}s`;
    }

    // GESTION QUALIFS
    function handleQualifInput(driver, field, value) {
        if (!qualifData[currentRound]) qualifData[currentRound] = {};
        if (!qualifData[currentRound][driver]) qualifData[currentRound][driver] = { time: '', penalty: 0 };
        qualifData[currentRound][driver][field] = value;
        localStorage.setItem('gp_qualif_data', JSON.stringify(qualifData));
        updateQualifTable();
    }

    function renderQualifPanel() {
        if (!qualifData[currentRound]) qualifData[currentRound] = {};
        let html = `<h2><span>GP ${currentRound} - Chronos Qualifs</span></h2>`;

        drivers.forEach(driver => {
            let data = qualifData[currentRound][driver] || { time: '', penalty: 0 };
            html += `
                <div class="driver-row">
                    <div class="driver-name">${driver}</div>
                    <div>
                        <input type="text" placeholder="Chrono (ex: 1:24.510)" value="${data.time || ''}" 
                            oninput="handleQualifInput('${driver}', 'time', this.value)" ${!isUnlocked ? 'disabled' : ''}>
                    </div>
                    <div>
                        <select onchange="handleQualifInput('${driver}', 'penalty', parseFloat(this.value))" ${!isUnlocked ? 'disabled' : ''}>
                            <option value="0" ${data.penalty == 0 ? 'selected' : ''}>0s</option>
                            <option value="5" ${data.penalty == 5 ? 'selected' : ''}>+5s</option>
                            <option value="10" ${data.penalty == 10 ? 'selected' : ''}>+10s</option>
                            <option value="20" ${data.penalty == 20 ? 'selected' : ''}>+20s</option>
                        </select>
                    </div>
                </div>
            `;
        });

        html += `<div id="qualifTableContainer"></div>`;
        document.getElementById('qualifContent').innerHTML = html;
        updateQualifTable();
    }

    function updateQualifTable() {
        let roundData = qualifData[currentRound] || {};
        let processed = drivers.map(driver => {
            let d = roundData[driver] || { time: '', penalty: 0 };
            let rawSec = parseTimeToSeconds(d.time);
            let totalSec = rawSec === Infinity ? Infinity : rawSec + (d.penalty || 0);
            return { driver, timeStr: d.time, penalty: d.penalty || 0, totalSec };
        });

        processed.sort((a, b) => a.totalSec - b.totalSec);

        let tableHtml = `
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Pilote</th>
                        <th>Chrono Brut</th>
                        <th>Pénalité</th>
                        <th>Chrono Final</th>
                        <th>Écart</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let leaderSec = processed[0] && processed[0].totalSec !== Infinity ? processed[0].totalSec : null;

        processed.forEach((item, index) => {
            let posBadge = index < 3 ? `<span class="badge badge-${index+1}">${index+1}</span>` : `${index+1}`;
            let diff = "";
            if (item.totalSec === Infinity) {
                diff = "-";
            } else if (index === 0) {
                diff = "Leader";
            } else {
                let gap = (item.totalSec - leaderSec).toFixed(3);
                diff = `+${gap}s`;
            }

            tableHtml += `
                <tr>
                    <td>${posBadge}</td>
                    <td><strong>${item.driver}</strong></td>
                    <td>${item.timeStr || '--:--.---'}</td>
                    <td>${item.penalty > 0 ? '+' + item.penalty + 's' : '-'}</td>
                    <td>${formatSeconds(item.totalSec)}</td>
                    <td>${diff}</td>
                </tr>
            `;
        });

        tableHtml += `</tbody></table>`;
        let container = document.getElementById('qualifTableContainer');
        if (container) container.innerHTML = tableHtml;
    }

    // GESTION PLACES FINALES
    function handlePlaceInput(driver, place) {
        if (!placesData[currentRound]) placesData[currentRound] = {};
        placesData[currentRound][driver] = place;
        localStorage.setItem('gp_places_data', JSON.stringify(placesData));
        updatePlacesTable();
    }

    function renderPlacesPanel() {
        if (!placesData[currentRound]) placesData[currentRound] = {};
        let html = `<h2><span>GP ${currentRound} - Places Finales</span></h2>`;

        drivers.forEach(driver => {
            let currentPlace = placesData[currentRound][driver] || '';
            html += `
                <div class="driver-row">
                    <div class="driver-name">${driver}</div>
                    <div style="grid-column: span 2;">
                        <select onchange="handlePlaceInput('${driver}', this.value)" ${!isUnlocked ? 'disabled' : ''}>
                            <option value="">Sélectionner la place finale</option>
                            <option value="1er" ${currentPlace === '1er' ? 'selected' : ''}>1er</option>
                            <option value="2e" ${currentPlace === '2e' ? 'selected' : ''}>2e</option>
                            <option value="3e" ${currentPlace === '3e' ? 'selected' : ''}>3e</option>
                            <option value="4e" ${currentPlace === '4e' ? 'selected' : ''}>4e</option>
                            <option value="5e" ${currentPlace === '5e' ? 'selected' : ''}>5e</option>
                            <option value="6e" ${currentPlace === '6e' ? 'selected' : ''}>6e</option>
                        </select>
                    </div>
                </div>
            `;
        });

        html += `<div id="placesTableContainer"></div>`;
        document.getElementById('placesContent').innerHTML = html;
        updatePlacesTable();
    }

    function updatePlacesTable() {
        let roundData = placesData[currentRound] || {};
        let tableHtml = `
            <table class="results-table" style="margin-top: 20px;">
                <thead>
                    <tr>
                        <th>Pilote</th>
                        <th>Place Finale</th>
                    </tr>
                </thead>
                <tbody>
        `;

    drivers.forEach(driver => {
            let place = roundData[driver] || '-';
            let badgeClass = '';
            if (place === '1er') badgeClass = 'badge badge-1';
            else if (place === '2e') badgeClass = 'badge badge-2';
            else if (place === '3e') badgeClass = 'badge badge-3';

            tableHtml += `
                <tr>
                    <td><strong>${driver}</strong></td>
                    <td>${badgeClass ? `<span class="${badgeClass}">${place}</span>` : place}</td>
                </tr>
            `;
        });

        tableHtml += `</tbody></table>`;
        let container = document.getElementById('placesTableContainer');
        if (container) container.innerHTML = tableHtml;
    }

    window.onload = init;
</script>

</body>
</html>
